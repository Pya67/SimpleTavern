# Follow the app container's address when Compose recreates it.
upstream nextjs {
    zone nextjs 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server app:3000 resolve;
}

# An HTTPS terminator can forward its original scheme on the loopback listener.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80 default_server;
    server_name _;
    include /etc/nginx/tls.d/*.conf;

    # Backup restores and bulk imports can be larger than avatar uploads.
    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $remote_addr;

    # Deliver Next.js streaming responses and chat NDJSON as they arrive.
    proxy_buffering off;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://nextjs;
    }

    location = /api/uploads {
        # Allow the app's 15 MiB upload limit plus multipart overhead.
        client_max_body_size 16m;
        proxy_pass http://nextjs;
    }
}
